<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <!-- SEO -->
    <title>اسباب بازی یاسر شاپ | فروشگاه اسباب‌بازی آنلاین</title>

    <meta name="description"
          content="اسباب بازی یاسر شاپ - خرید آنلاین انواع اسباب‌بازی با بهترین قیمت و ارسال سریع">

    <meta name="google-site-verification"
          content="AE17W4jnsil1Qzhf3e7sl1vwYJcKdU7IpfT3ZPZr46M" />

    {% load static %}

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>

<!-- HEADER -->
<div class="topbar">

    <div class="logo">
        🎈 اسباب بازی یاسر شاپ
    </div>

    <div class="search-box">
        <input type="text" placeholder="جستجوی اسباب بازی...">
        <button>🔍</button>
    </div>

</div>

<!-- دسته بندی -->
<div class="categories">

    <button>همه</button>
    <button>ماشین</button>
    <button>لگو</button>
    <button>عروسک</button>
    <button>تفنگ</button>
    <button>کنترلی</button>
    <button>فکری</button>

</div>

<!-- محصولات -->
<div class="container py-4">

    <div class="row g-4">

        {% for product in products %}

        <div class="col-lg-3 col-md-6">

            <div class="product-card">

                <div class="img-box">

                    <img src="{{ product.image.url }}"
                         alt="{{ product.name }}">

                </div>

                <div class="content">

                    <h3>{{ product.name }}</h3>

                    <p class="desc">
                        {{ product.description }}
                    </p>

                    <div class="price">
                        {{ product.price }} $
                    </div>

                    <button class="buy-btn">
                        خرید 💳
                    </button>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
